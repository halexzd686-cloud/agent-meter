<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Agent Meter</title><link rel="stylesheet" href="style.css"></head><body>
<section id="rail-view" hidden><aside class="rail-shell"><div class="rail-grip" title="拖动可调整位置，松开后贴到屏幕右侧" aria-label="拖动轨道"><svg viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r=".6"/><circle cx="7" cy="3" r=".6"/><circle cx="3" cy="7" r=".6"/><circle cx="7" cy="7" r=".6"/></svg></div><div id="rail-accounts"></div><footer class="rail-foot"><button id="rail-settings" aria-label="打开设置" title="设置"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.5 2h3l.5 2 1.7 1 1.8-.6 1.4 2.5-1.4 1.5v1.2l1.4 1.5-1.4 2.5-1.8-.6-1.7 1-.5 2h-3L6 14l-1.7-1-1.8.6L1 11.1l1.4-1.5V8.4L1 6.9l1.5-2.5L4.3 5 6 4l.5-2Z" transform="translate(1 0) scale(.8)" stroke="currentColor" stroke-width="1.1"/><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.1"/></svg></button><button id="rail-collapse" aria-label="收起轨道" title="收起"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m5 3 4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></footer></aside></section>
<button class="rail-peek" id="rail-peek" hidden aria-label="展开额度轨道"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m9 3-4 4 4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="peek-mark"></span></button>
<main id="panel-view" class="panel-card" hidden><p class="demo-note" id="panel-demo" hidden>演示数据 · 未连接真实账户</p><header class="panel-header"><div class="identity"><span id="panel-brand"></span><span id="panel-name"></span></div><button class="icon-button" id="panel-close" aria-label="关闭详情"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button></header><p class="connection" id="panel-connection"></p><div class="panel-state"><span id="panel-mark"></span><span id="panel-state"></span></div><div class="quota-heading"><span id="panel-quota-label"></span><strong id="panel-quota-value">—</strong></div><div class="panel-meter" id="panel-meter"><i></i></div><p class="quota-note" id="panel-quota-note"></p><div class="task-list" id="panel-tasks"></div><div class="panel-actions"><button class="text-action" id="panel-open"><span id="panel-open-mark"></span><span id="panel-open-label">在应用中查看</span><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7h8M7 3l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="quiet-action" id="panel-settings">连接设置</button></div><p class="panel-feedback" id="panel-feedback" role="status"></p></main>
<main class="settings-shell" id="settings-view" hidden><header class="settings-title"><div><h1>Agent 额度小组件</h1><p>砂白侧刻度 · 额度与任务状态</p></div><button class="plain-button" id="refresh">立即更新</button></header><section class="settings-section"><h2>桌面与提醒</h2><div class="checks"><label class="check"><input type="checkbox" id="always-on-top">始终置顶</label><label class="check"><input type="checkbox" id="notifications">整项任务完成或等待操作时通知</label><label class="check"><input type="checkbox" id="start-at-login">开机启动</label></div><label class="field"><span>需要你操作时</span><select id="attention-mode"><option value="panel">展开组件详情</option><option value="notify">仅发送系统通知</option><option value="activate-app">通知并唤醒对应应用</option></select></label><p class="support-note">单轮回复、单步执行结束时保持安静；整项任务确认完成后提醒一次。</p><p class="support-note" id="login-note"></p></section><section class="settings-section"><h2>应用连接</h2><p class="support-note">首次使用请确认下方应用并保存设置，再启用所选应用的只读检测。Codex 和 Kimi 会读取本机额度与会话状态元数据；密钥不进入界面，提示词正文不保存或上传。</p><div id="providers-form"></div></section><section class="settings-section"><h2>预览与本地事件</h2><label class="check"><input type="checkbox" id="demo-mode">使用演示数据</label><div class="demo-controls" id="demo-controls" hidden><select id="demo-provider" aria-label="演示应用"></select><select id="demo-state" aria-label="演示状态"><option value="thinking">思考中</option><option value="running">执行中</option><option value="waiting">等待授权</option><option value="completed">已完成</option><option value="idle">空闲</option><option value="error">异常</option></select><button class="plain-button" id="apply-demo">切换演示状态</button></div><p class="support-note" id="bridge-status"></p><button class="text-action" id="copy-bridge">复制本地事件接入示例</button><p class="support-note">Kimi Code 自动连接本机服务；ZCode、Claude、Cursor 仅预留实验性事件接口，尚无原生额度适配。尚未收到数据时显示“未同步”。</p></section><div class="save-row"><button class="plain-button" id="save-settings">保存设置</button><p id="settings-feedback" role="status"></p></div></main>
<script type="module" src="app.mjs"></script></body></html>
