name: Verify and build Alpha
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-meter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            build: installer
          - os: macos-15
            artifact: mac-arm64-experimental
            build: mac:dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:clean
      - run: npm run check:release
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- --tag "$RELEASE_TAG"
      - run: npm run audit:check
      - name: Windows renderer and encryption verification
        if: runner.os == 'Windows'
        run: npm run test:renderer
      - name: Build native target
        run: npm run "${{ matrix.build }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged source and version
        run: node scripts/verify-package.mjs
      - name: Verify macOS signatures, architecture and image
        if: runner.os == 'macOS'
        run: |
          test "$(lipo -archs 'dist/mac-arm64/Agent Meter.app/Contents/MacOS/Agent Meter')" = "arm64"
          codesign --verify --deep --strict 'dist/mac-arm64/Agent Meter.app'
          hdiutil verify dist/*.dmg
      - run: npm run release:checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: |
            .cache/render-verification/
            .cache/dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*'
          path: release-artifacts
      - name: Create draft prerelease for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --prerelease \
            --title "Agent Meter $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md
          find release-artifacts/windows-x64 release-artifacts/mac-arm64-experimental -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.sha256' \) -print0 |
            xargs -0 gh release upload "$RELEASE_TAG"
